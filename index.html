      <button class="ghost-btn" data-close>Annulla</button>
      <button class="primary-btn" id="dispApplyBtn">Applica Dispersione</button>
    `
  });

  const canvas = $("dispCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");

  loadImage(el.src).then((img) => {
    canvas.width = Math.min(600, img.naturalWidth || 500);
    canvas.height = Math.round((canvas.width * (img.naturalHeight || 350)) / (img.naturalWidth || 500));
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    renderDispersionPreview();
  });

  function renderDispersionPreview() {
    const dir = $("dispDir")?.value || "right";
    const count = Number($("dispCount")?.value) || 120;
    const spread = Number($("dispSpread")?.value) || 80;
    const w = canvas.width, h = canvas.height;

    // Draw particle shards
    for (let i = 0; i < count; i++) {
      const srcX = w * 0.6 + (Math.random() - 0.5) * (w * 0.3);
      const srcY = Math.random() * h;
      const pixel = ctx.getImageData(Math.min(w - 1, Math.max(0, srcX)), Math.min(h - 1, Math.max(0, srcY)), 1, 1).data;
      const color = `rgba(${pixel[0]},${pixel[1]},${pixel[2]},${(pixel[3] / 255) * (0.4 + Math.random() * 0.6)})`;

      const dist = Math.random() * spread;
      const targetX = dir === "right" ? srcX + dist : (dir === "left" ? srcX - dist : srcX + (Math.random() - 0.5) * spread);
      const targetY = dir === "down" ? srcY + dist : (dir === "up" ? srcY - dist : srcY + (Math.random() - 0.5) * spread);
      const sz = 2 + Math.random() * 7;

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(targetX, targetY);
      ctx.lineTo(targetX + sz, targetY + sz * 0.5);
      ctx.lineTo(targetX + sz * 0.3, targetY + sz);
      ctx.fill();
    }
  }

  ["dispDir", "dispCount", "dispSpread"].forEach((id) => {
    const elInp = $(id);
    if (elInp) elInp.oninput = renderDispersionPreview;
  });

  $("dispApplyBtn").onclick = () => {
    el.src = canvas.toDataURL("image/png");
    commit("Effetto dispersione applicato");
    closeModal();
    renderAll();
    toast("Dispersione applicata", "success");
  };
}

    `
  });

  const canvas = $("cutCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  let lassoPoints = [];
  let isDrawing = false;

  loadImage(el.src).then((img) => {
    canvas.width = Math.min(600, img.naturalWidth || 500);
    canvas.height = Math.round((canvas.width * (img.naturalHeight || 350)) / (img.naturalWidth || 500));
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  });

  document.querySelectorAll(".cut-mode-btn").forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll(".cut-mode-btn").forEach((btn) => btn.classList.remove("active"));
      b.classList.add("active");
      mode = b.dataset.mode;
    };
  });

  canvas.onpointerdown = (ev) => {
    isDrawing = true;
    const r = canvas.getBoundingClientRect();
    const pt = {
      x: ((ev.clientX - r.left) / r.width) * canvas.width,
      y: ((ev.clientY - r.top) / r.height) * canvas.height
    };
    if (mode === "lasso") {
      lassoPoints = [pt];

      ctx.save();

      ctx.arc(pt.x, pt.y, brushSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  };

  canvas.onpointermove = (ev) => {
    if (!isDrawing) return;
    const r = canvas.getBoundingClientRect();
    const pt = {
      x: ((ev.clientX - r.left) / r.width) * canvas.width,
      y: ((ev.clientY - r.top) / r.height) * canvas.height
    };
    if (mode === "lasso") {
      lassoPoints.push(pt);
      ctx.strokeStyle = "#3bd6a0";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(lassoPoints[lassoPoints.length - 2].x, lassoPoints[lassoPoints.length - 2].y);
      ctx.lineTo(pt.x, pt.y);
      ctx.stroke();
    } else if (mode === "eraser") {
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, brushSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  };

  canvas.onpointerup = () => {
    if (isDrawing && mode === "lasso" && lassoPoints.length > 4) {
      // Cut outside lasso
      const maskCanvas = document.createElement("canvas");
      maskCanvas.width = canvas.width;
      maskCanvas.height = canvas.height;
      const mctx = maskCanvas.getContext("2d");
      mctx.beginPath();
      mctx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
      lassoPoints.forEach((p) => mctx.lineTo(p.x, p.y));
      mctx.closePath();
      mctx.fillStyle = "#fff";
      mctx.fill();

      ctx.save();
      ctx.globalCompositeOperation = "destination-in";
      ctx.drawImage(maskCanvas, 0, 0);
      ctx.restore();
    }
    isDrawing = false;
  };

  $("cutApplyBtn").onclick = () => {
    el.src = canvas.toDataURL("image/png");
    commit("Soggetto isolato con ritaglio trasparente");
    closeModal();
    renderAll();
    toast("Soggetto isolato con successo", "success");
  };
}

// Clone stamp tool (Clona con mirino sorgente)
function openCloneStampModal() {
  const el = selectedImage();
  if (!el) {
    toast("Seleziona prima un'immagine", "warn");
    return;
  }
  let sourcePoint = null;
  let isSettingSource = false;
  let brushSize = 25;
  let isCloning = false;

  openModal({
    title: "Timbro Clona (Clone Stamp)",
    icon: "🎯",
    sub: "Duplica porzioni di immagine usando un mirino sorgente.",
    size: "wide",
    body: `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <button class="ghost-btn active" id="cloneSetSrcBtn">🎯 Imposta Sorgente (o Alt+Clic)</button>
        <span id="cloneSrcStatus" style="font-size:11px;color:var(--dim)">Clicca sull'immagine per impostare il mirino</span>
        <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
          <label style="font-size:11px;color:var(--dim)">Dimensione:</label>
          <input type="range" id="cloneSizeSlider" min="5" max="80" value="25" style="width:100px" />
          <span id="cloneSizeVal" style="font-size:11px">25px</span>
        </div>
      </div>
      <div style="border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#111;display:flex;justify-content:center;position:relative">
        <canvas id="cloneCanvas" style="max-width:100%;max-height:360px;cursor:crosshair;display:block"></canvas>
      </div>
    `,
    foot: `
      <button class="ghost-btn" data-close>Annulla</button>
      <button class="primary-btn" id="cloneApplyBtn">Applica Clonazione</button>
    `
  });

  const canvas = $("cloneCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const origCanvas = document.createElement("canvas");
  const octx = origCanvas.getContext("2d");

  loadImage(el.src).then((img) => {
    canvas.width = Math.min(800, img.naturalWidth || 600);
    canvas.height = Math.round((canvas.width * (img.naturalHeight || 400)) / (img.naturalWidth || 600));
    origCanvas.width = canvas.width;
    origCanvas.height = canvas.height;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    octx.drawImage(img, 0, 0, canvas.width, canvas.height);
    sourcePoint = { x: Math.round(canvas.width * 0.3), y: Math.round(canvas.height * 0.3) };
    drawSourceReticle();
  });

  const setSrcBtn = $("cloneSetSrcBtn");
  const srcStatus = $("cloneSrcStatus");
  const sizeSlider = $("cloneSizeSlider");
  const sizeVal = $("cloneSizeVal");

  if (sizeSlider) {
    sizeSlider.oninput = () => {
      brushSize = Number(sizeSlider.value);
      if (sizeVal) sizeVal.textContent = brushSize + "px";
    };
  }

  if (setSrcBtn) {
    setSrcBtn.onclick = () => {
      isSettingSource = true;
      srcStatus.textContent = "Clicca sull'immagine per posizionare il mirino sorgente";
      srcStatus.style.color = "var(--accent)";
    };
  }

  function drawSourceReticle() {
    if (!sourcePoint) return;
    srcStatus.textContent = `Mirino sorgente impostato su (${Math.round(sourcePoint.x)}, ${Math.round(sourcePoint.y)})`;
    srcStatus.style.color = "var(--ok)";
  }

  let strokeOffset = null;

  canvas.onpointerdown = (ev) => {
    const r = canvas.getBoundingClientRect();
    const pt = {
      x: ((ev.clientX - r.left) / r.width) * canvas.width,
      y: ((ev.clientY - r.top) / r.height) * canvas.height
    };

    if (ev.altKey || isSettingSource) {
      sourcePoint = pt;
      isSettingSource = false;
      drawSourceReticle();
      return;
    }

    if (!sourcePoint) {
      sourcePoint = pt;
      drawSourceReticle();
      return;
    }

    isCloning = true;
    strokeOffset = { dx: pt.x - sourcePoint.x, dy: pt.y - sourcePoint.y };
    cloneAt(pt);
  };

  canvas.onpointermove = (ev) => {
    if (!isCloning) return;
    const r = canvas.getBoundingClientRect();
    const pt = {
      x: ((ev.clientX - r.left) / r.width) * canvas.width,
      y: ((ev.clientY - r.top) / r.height) * canvas.height
    };
    cloneAt(pt);
  };

  canvas.onpointerup = () => {
    isCloning = false;
    strokeOffset = null;
    octx.drawImage(canvas, 0, 0);
  };

  function cloneAt(pt) {
    if (!sourcePoint || !strokeOffset) return;
    const sx = pt.x - strokeOffset.dx;
    const sy = pt.y - strokeOffset.dy;

    ctx.save();
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, brushSize, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(origCanvas, sx - brushSize, sy - brushSize, brushSize * 2, brushSize * 2, pt.x - brushSize, pt.y - brushSize, brushSize * 2, brushSize * 2);
    ctx.restore();
  }

  $("cloneApplyBtn").onclick = () => {
    el.src = canvas.toDataURL("image/png");
    commit("Timbro Clona applicato");
    closeModal();
    renderAll();
    toast("Clonazione porzione immagine applicata", "success");
  };
}

// G. Effetti FX: Sfocature (Gaussiana, Radiale, Tilt-Shift), Glitch, Pixelate, Motion Blur
async function applySpecialFx(fxName, opts = {}) {
  const el = selectedImage();
  if (!el) {
    toast("Seleziona prima un'immagine", "warn");
    return;
  }
  try {
    toast(`Applicazione effetto ${fxName}…`, "info", 1200);
    const img = await loadImage(el.src);
    const c = document.createElement("canvas");
    c.width = img.naturalWidth || el.w;
    c.height = img.naturalHeight || el.h;
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0);

    const w = c.width, h = c.height;

    if (fxName === "blur_gaussian") {
      ctx.filter = `blur(${opts.radius || 10}px)`;
      ctx.drawImage(img, 0, 0);
    } else if (fxName === "blur_tiltshift") {
      // Sharp center band, blurred top and bottom
      const blurred = document.createElement("canvas");
      blurred.width = w; blurred.height = h;
      const bctx = blurred.getContext("2d");
      bctx.filter = "blur(18px)";
      bctx.drawImage(img, 0, 0);

      // Gradient mask for focus
      ctx.drawImage(blurred, 0, 0);
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, h * 0.35, w, h * 0.3);
      ctx.clip();
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    } else if (fxName === "glitch") {
      // Chromatic RGB displacement & scanlines
      const idata = ctx.getImageData(0, 0, w, h);
      const d = idata.data;
      const shift = Math.round(w * 0.02);
      for (let y = 0; y < h; y++) {
        const rowShift = (Math.sin(y * 0.1) * shift) | 0;
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          const redIdx = (y * w + clamp(x + rowShift, 0, w - 1)) * 4;
          d[idx] = d[redIdx]; // Shift red channel
        }
      }
      ctx.putImageData(idata, 0, 0);
    } else if (fxName === "pixelate") {
      const size = opts.size || 12;
      const offCanvas = document.createElement("canvas");
      offCanvas.width = Math.max(1, Math.round(w / size));
      offCanvas.height = Math.max(1, Math.round(h / size));
      const offCtx = offCanvas.getContext("2d");
      offCtx.imageSmoothingEnabled = false;
      offCtx.drawImage(c, 0, 0, offCanvas.width, offCanvas.height);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(offCanvas, 0, 0, w, h);
    }

    el.src = c.toDataURL("image/png");
    commit(`Effetto FX: ${fxName}`);
    renderAll();
    toast(`Effetto ${fxName} applicato con successo!`, "success");
  } catch (e) {
    console.error(e);
    toast("Errore durante l'applicazione dell'effetto", "error");
  }
}

// H. Dipingi Effetto FX Localmente (Paint FX on selective image areas)
function openPaintFxModal() {
  const el = selectedImage();
  if (!el) {
    toast("Seleziona prima un'immagine", "warn");
    return;
  }

  let selectedEffect = "blur"; // blur, glitch, pixelate, bw
  let brushRadius = 25;

  openModal({
    title: "Dipingi Effetto (Applicazione Locale con Pennello)",
    icon: "🖌",
    sub: "Dipingi un effetto speciale solo su specifiche porzioni dell'immagine.",
    size: "wide",
    body: `
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <button class="ghost-btn pfx-btn active" data-fx="blur">◌ Sfocatura</button>
        <button class="ghost-btn pfx-btn" data-fx="glitch">⚡ Glitch Digitale</button>
        <button class="ghost-btn pfx-btn" data-fx="pixelate">▦ Pixelate</button>
        <button class="ghost-btn pfx-btn" data-fx="bw">◐ Bianco/Nero</button>
      </div>
      <div style="border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#111;display:flex;justify-content:center">
        <canvas id="pfxCanvas" style="max-width:100%;max-height:350px;cursor:crosshair;display:block"></canvas>
      </div>
    `,
    foot: `
      <button class="ghost-btn" data-close>Annulla</button>
      <button class="primary-btn" id="pfxApplyBtn">Applica su Immagine</button>
    `
  });

  const canvas = $("pfxCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const effectCanvas = document.createElement("canvas");
  const ectx = effectCanvas.getContext("2d");

  loadImage(el.src).then((img) => {
    canvas.width = Math.min(600, img.naturalWidth || 500);
    canvas.height = Math.round((canvas.width * (img.naturalHeight || 350)) / (img.naturalWidth || 500));
    effectCanvas.width = canvas.width;
    effectCanvas.height = canvas.height;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    updateEffectLayer(img);
  });

  function updateEffectLayer(img) {
    ectx.clearRect(0, 0, effectCanvas.width, effectCanvas.height);
    if (selectedEffect === "blur") {
      ectx.filter = "blur(14px)";
      ectx.drawImage(img, 0, 0, effectCanvas.width, effectCanvas.height);
    } else if (selectedEffect === "bw") {
      ectx.filter = "grayscale(100%)";
      ectx.drawImage(img, 0, 0, effectCanvas.width, effectCanvas.height);
    } else if (selectedEffect === "pixelate") {
      const size = 12;
      const off = document.createElement("canvas");
      off.width = Math.round(effectCanvas.width / size);
      off.height = Math.round(effectCanvas.height / size);
      const octx = off.getContext("2d");
      octx.imageSmoothingEnabled = false;
      octx.drawImage(img, 0, 0, off.width, off.height);
      ectx.imageSmoothingEnabled = false;
      ectx.drawImage(off, 0, 0, effectCanvas.width, effectCanvas.height);
    } else {
      ectx.filter = "invert(100%)";
      ectx.drawImage(img, 0, 0, effectCanvas.width, effectCanvas.height);
    }
  }

  document.querySelectorAll(".pfx-btn").forEach((btn) => {
    btn.onclick = () => {
      document.querySelectorAll(".pfx-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      selectedEffect = btn.dataset.fx;
      loadImage(el.src).then(updateEffectLayer);
    };
  });

  let isPainting = false;
  canvas.onpointerdown = (ev) => {
    isPainting = true;
    paintAt(ev);
  };
  canvas.onpointermove = (ev) => {
    if (isPainting) paintAt(ev);
  };
  canvas.onpointerup = () => { isPainting = false; };

  function paintAt(ev) {
    const r = canvas.getBoundingClientRect();
    const x = ((ev.clientX - r.left) / r.width) * canvas.width;
    const y = ((ev.clientY - r.top) / r.height) * canvas.height;

    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, brushRadius, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(effectCanvas, 0, 0);
    ctx.restore();
  }

  $("pfxApplyBtn").onclick = () => {
    el.src = canvas.toDataURL("image/png");
    commit("Effetto locale dipinto su immagine");
    closeModal();
    renderAll();
    toast("Effetto locale applicato con successo", "success");
  };
}

        /* ---------- autosalvataggio in IndexedDB (con lettura dei vecchi salvataggi) ---------- */ const IDB_NAME = "opp.db",

        function idbOpen() {
          if (idbHandle) return idbHandle;

            if (!window.indexedDB) {
              reject(new Error("IndexedDB non disponibile"));
              return;
            }
            const req = indexedDB.open(IDB_NAME, 1);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error || new Error("IndexedDB non apribile"));
          });
          idbHandle.catch(() => {
            idbHandle = null;
          });
          return idbHandle;

        async function idbSet(key, value) {
          const db = await idbOpen();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, "readwrite");
            tx.objectStore(IDB_STORE).put(value, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error || new Error("Scrittura annullata"));
          });
        }
        async function idbGet(key) {
          const db = await idbOpen();

            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => reject(req.error);
          });
        }
        async function idbDelete(key) {
          try {
            const db = await idbOpen();
            await new Promise((resolve, reject) => {
              const tx = db.transaction(IDB_STORE, "readwrite");
              tx.objectStore(IDB_STORE).delete(key);
              tx.oncomplete = () => resolve(true);
              tx.onerror = () => reject(tx.error);
              tx.onabort = () => reject(tx.error || new Error("Cancellazione annullata"));
            });
          } catch (e) {
            console.warn("IndexedDB: cancellazione non riuscita", e);

        /* ============================================================   FONT — sistema, file locali, Google Fonts con cache offline   ============================================================ */ const fontFacesLoaded =

        async function registerFontEntry(entry, silent = true) {

            return false;
          }
          const encoded = encodeURIComponent(family).replace(/%20/g, "+");
          const api = `https://fonts.googleapis.com/css2?family=${encoded}:wght@400;700&display=swap`;
          let css = "";
          try {
            const res = await fetch(api, { mode: "cors" });

        function chartSVG(el) {

              } else d = `M ${cx} ${cy} L ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1} Z`;
              inner += `<path d="${wround(d, 2)}" fill="${colors[i % colors.length]}" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>`;
              if (v / total > 0.055) {
                const am = (a0 + a1) / 2,

            pts.forEach((p, i) => {

            );
          } else {

              bottom = h - pad,

              inner += `<text x="${wround(x + bw / 2, 2)}" y="${h - 5}" text-anchor="middle" font-size="${Math.max(7, Math.min(12, w * 0.022))}" fill="rgba(50,65,95,.7)" font-family="Calibri">${esc(data[i]?.label || "")}</text>`;

          let done = false;

            const frame = $("effectFrame");
            if (!frame || ev.source !== frame.contentWindow) return;
            const d = ev.data || {};
            if (d.type !== "opp:image" || typeof d.dataUrl !== "string" || !d.dataUrl.startsWith("data:image/")) return;

              const sc = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight);
              const w = Math.max(20, Math.round(img.naturalWidth * sc));
              const h = Math.max(20, Math.round(img.naturalHeight * sc));
              closeModal();
              insertElement(
                imageElement(d.dataUrl, w, h, { name: String(d.name || eff.label).slice(0, 80), alt: eff.label }),

                  const m = line.match(/^(.*?)[:=]\s*(-?[\d.]+)\s*$/);
                  if (m) return { label: m[1].trim(), value: Number(m[2]) };
                  return null;
                }
                return { label: parts[0].trim(), value: Number(String(parts[1]).replace(",", ".")) };
              })
              .filter((x) => x && isFinite(x.value));
            if (!rows.length) {
              toast("Inserisci almeno un valore numerico", "warn");
              return;
            }
            el.data = rows;
            el.chartType = $("chartType").value;
            el.showValues = $("chartValues").value === "1";
            commit("Modifica grafico");
            closeModal();
            renderAll();
            toast("Grafico aggiornato", "success");

        async function openCropModal() {
          const el = selectedImage();
          if (!el) return;
          let ratios = { l: 0, t: 0, r: 0, b: 0 };
          const img = await loadImage(el.src).catch(() => null);
          if (!img) {
            toast("Immagine non leggibile", "error");
            return;
          }
          const maxW = 560,
            maxH = 330;
          const scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
          const pw = Math.max(80, img.naturalWidth * scale),
            ph = Math.max(60, img.naturalHeight * scale);
          openModal({
            title: "Ritaglia immagine",
            icon: "⌗",
            sub: "Regola i margini e applica il ritaglio.",
            size: "wide",
            body: `<div style="display:flex;justify-content:center;background:repeating-conic-gradient(#1a2538 0% 25%,#111a2b 0% 50%) 50%/18px 18px;border:1px solid var(--line);border-radius:6px;padding:8px"><canvas id="cropCanvas" width="${Math.round(pw)}" height="${Math.round(ph)}" style="max-width:100%;height:auto;display:block"></canvas></div><div class="field-row" style="margin-top:8px"><div class="field"><label>Da sinistra</label><input type="range" id="cropL" min="0" max="90" value="0"></div><div class="field"><label>Da destra</label><input type="range" id="cropR" min="0" max="90" value="0"></div></div><div class="field-row"><div class="field"><label>Dall'alto</label><input type="range" id="cropT" min="0" max="90" value="0"></div><div class="field"><label>Dal basso</label><input type="range" id="cropB" min="0" max="90" value="0"></div></div><div class="field-hint" id="cropInfo">Dimensione finale: ${img.naturalWidth} × ${img.naturalHeight} px</div>`,
            foot: `<button class="ghost-btn" data-close>Annulla</button><button class="primary-btn" id="cropApply">Ritaglia</button>`,
          });
          const canvas = $("cropCanvas"),
            ctx = canvas.getContext("2d");
          const draw = () => {
            const l = Number($("cropL").value),
              r = Number($("cropR").value),
              t = Number($("cropT").value),
              b = Number($("cropB").value);
            if (l + r > 95) {
              $("cropR").value = Math.max(0, 95 - l);
            }
            if (t + b > 95) {
              $("cropB").value = Math.max(0, 95 - t);
            }
            ratios = { l: Number($("cropL").value), t: Number($("cropT").value), r: Number($("cropR").value), b: Number($("cropB").value) };
            const w = canvas.width,
              h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            const x = (w * ratios.l) / 100,
              y = (h * ratios.t) / 100,
              cw = (w * (100 - ratios.l - ratios.r)) / 100,
              ch = (h * (100 - ratios.t - ratios.b)) / 100;
            ctx.fillStyle = "rgba(3,7,16,.64)";
            ctx.fillRect(0, 0, w, y);
            ctx.fillRect(0, y + ch, w, h - y - ch);
            ctx.fillRect(0, y, x, ch);
            ctx.fillRect(x + cw, y, w - x - cw, ch);
            ctx.strokeStyle = "#ffb15e";
            ctx.lineWidth = 2;
            ctx.setLineDash([7, 4]);
            ctx.strokeRect(x + 0.5, y + 0.5, Math.max(1, cw - 1), Math.max(1, ch - 1));
            ctx.setLineDash([]);
            $("cropInfo").textContent =
              `Dimensione finale: ${Math.max(1, Math.round((img.naturalWidth * (100 - ratios.l - ratios.r)) / 100))} × ${Math.max(1, Math.round((img.naturalHeight * (100 - ratios.t - ratios.b)) / 100))} px`;
          };
          ["cropL", "cropR", "cropT", "cropB"].forEach((id) => ($(id).oninput = draw));
          draw();
          $("cropApply").onclick = () => {
            const sx = (img.naturalWidth * ratios.l) / 100,
              sy = (img.naturalHeight * ratios.t) / 100;
            const sw = (img.naturalWidth * (100 - ratios.l - ratios.r)) / 100,
              sh = (img.naturalHeight * (100 - ratios.t - ratios.b)) / 100;
            if (sw < 2 || sh < 2) {
              toast("Ritaglio troppo piccolo", "warn");
              return;
            }
            const out = document.createElement("canvas");
            out.width = Math.max(1, Math.round(sw));
            out.height = Math.max(1, Math.round(sh));
            out.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, out.width, out.height);
            el.src = out.toDataURL("image/png");
            const aspect = out.width / out.height;
            const cx0 = el.x + el.w / 2,
              cy0 = el.y + el.h / 2;
            el.h = el.w / aspect;
            if (el.h > state.H * 1.4) {
              el.h = state.H;
              el.w = el.h * aspect;

            el.x = cx0 - el.w / 2;
            el.y = cy0 - el.h / 2;
            commit("Ritaglia immagine");
            closeModal();
            renderAll();
            toast("Immagine ritagliata", "success");
          };
        }
        async function removeImageBackground() {
          const el = selectedImage();
          if (!el) return;
          openModal({
            title: "Rimuovi sfondo",
            icon: "◐",
            sub: "Rimuove uno sfondo uniforme campionando i bordi dell'immagine.",
            body: `<div class="field"><label>Tolleranza</label><input type="range" id="bgTol" min="8" max="120" value="42"><div class="field-hint"><span id="bgTolVal">42</span> · valori bassi rimuovono meno pixel</div></div><div class="field"><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="bgEdge" checked> rimuovi solo lo sfondo collegato ai bordi</label></div><div class="prop-note">Funziona meglio con sfondi uniformi (bianco, verde, blu). Il risultato è un PNG trasparente incorporato.</div>`,
            foot: `<button class="ghost-btn" data-close>Annulla</button><button class="primary-btn" id="bgRemoveApply">Rimuovi sfondo</button>`,
          });
          $("bgTol").oninput = (ev) => ($("bgTolVal").textContent = ev.target.value);
          $("bgRemoveApply").onclick = async () => {
            const tol = Number($("bgTol").value) || 42,
              edgeOnly = $("bgEdge").checked;
            try {
              const img = await loadImage(el.src);
              const c = document.createElement("canvas");
              c.width = img.naturalWidth;
              c.height = img.naturalHeight;
              const ctx = c.getContext("2d", { willReadFrequently: true });
              ctx.drawImage(img, 0, 0);
              const data = ctx.getImageData(0, 0, c.width, c.height),
                px = data.data,
                w = c.width,
                h = c.height;
              let sr = 0,
                sg = 0,
                sb = 0,
                n = 0;
              const sample = (x, y) => {
                const i = (y * w + x) * 4;
                sr += px[i];
                sg += px[i + 1];
                sb += px[i + 2];
                n++;
              };
              for (let x = 0; x < w; x += Math.max(1, Math.floor(w / 60))) {
                sample(x, 0);
                sample(x, h - 1);
              }
              for (let y = 0; y < h; y += Math.max(1, Math.floor(h / 60))) {
                sample(0, y);
                sample(w - 1, y);
              }
              sr /= n;
              sg /= n;
              sb /= n;
              const threshold = tol * tol * 3;
              if (edgeOnly) {
                const seen = new Uint8Array(w * h),
                  stack = [];
                const near = (idx) => {
                  const i = idx * 4;
                  const dr = px[i] - sr,
                    dg = px[i + 1] - sg,
                    db = px[i + 2] - sb;
                  return dr * dr + dg * dg + db * db < threshold;
                };
                for (let x = 0; x < w; x++) {
                  if (near(x)) stack.push(x);
                  if (near((h - 1) * w + x)) stack.push((h - 1) * w + x);
                }
                for (let y = 0; y < h; y++) {
                  if (near(y * w)) stack.push(y * w);
                  if (near(y * w + w - 1)) stack.push(y * w + w - 1);
                }
                while (stack.length) {
                  const idx = stack.pop();
                  if (idx == null || seen[idx]) continue;
                  seen[idx] = 1;
                  if (!near(idx)) continue;
                  px[idx * 4 + 3] = 0;
                  const x = idx % w,
                    y = (idx - x) / w;
                  if (x > 0) stack.push(idx - 1);
                  if (x < w - 1) stack.push(idx + 1);
                  if (y > 0) stack.push(idx - w);
                  if (y < h - 1) stack.push(idx + w);
                }
              } else {
                for (let i = 0; i < px.length; i += 4) {
                  const dr = px[i] - sr,
                    dg = px[i + 1] - sg,
                    db = px[i + 2] - sb;
                  if (dr * dr + dg * dg + db * db < threshold) px[i + 3] = 0;
                }
              }
              ctx.putImageData(data, 0, 0);
              el.src = c.toDataURL("image/png");
              el.name = (el.name || "Immagine") + " senza sfondo";
              commit("Rimuovi sfondo");
              closeModal();
              renderAll();
              toast("Sfondo rimosso", "success");
            } catch (e) {
              console.error(e);
              toast("Operazione non riuscita", "error");
            }
          };
        }

        async function expandImage() {
          const el = selectedImage();
          if (!el) return;

            const img = await loadImage(el.src);
            const pad = Math.round(Math.min(img.naturalWidth, img.naturalHeight) * 0.12);
            const c = document.createElement("canvas");
            c.width = img.naturalWidth + pad * 2;
            c.height = img.naturalHeight + pad * 2;

        function downloadDoc() {

        let projectFileHandle = null;

        async function persistFileHandle(handle) {
          try {
            await idbSet(FS_HANDLE_KEY, handle);
            await idbSet("lastFileSave", Date.now());
          } catch (e) {
            console.warn("Handle del file non memorizzabile", e);
          }
        }
        async function forgetFileHandle() {
          projectFileHandle = null;
          state.fileSavedAt = null;
          state.fileName = "";
          await idbDelete(FS_HANDLE_KEY);
          await idbDelete("lastFileSave");
        }
        async function loadPersistedHandle() {
          try {
            const handle = await idbGet(FS_HANDLE_KEY);
            if (!handle) return null;
            if (typeof handle.createWritable !== "function") {
              await idbDelete(FS_HANDLE_KEY);
              return null;
            }
            let perm = "granted";
            if (handle.queryPermission) {
              try {
                perm = await handle.queryPermission({ mode: "readwrite" });
              } catch (e) {
                perm = "prompt";
              }
            }
            if (perm === "denied") {
              await idbDelete(FS_HANDLE_KEY);
              return null;
            }
            return handle;
          } catch (e) {
            console.warn("Handle del file non recuperabile", e);
            return null;
          }
        }
        async function writableForHandle(handle) {
          if (!handle || typeof handle.createWritable !== "function") return null;
          let perm = "granted";
          if (handle.queryPermission) {
            try {
              perm = await handle.queryPermission({ mode: "readwrite" });
            } catch (e) {
              perm = "prompt";
            }
          }
          if (perm !== "granted" && handle.requestPermission) {
            try {
              perm = await handle.requestPermission({ mode: "readwrite" });
            } catch (e) {
              perm = "denied";
            }
          }
          if (perm !== "granted") return null;
          return handle.createWritable();
        }
        async function saveProjectToFile(opts = {}) {
          const text = JSON.stringify(JSON.parse(serializeDoc()), null, 2);
          const blob = new Blob([text], { type: "application/json;charset=utf-8" });
          const suggested = cleanName(state.docName) + ".opp.json";
          const done = (name) => {
            state.fileSavedAt = Date.now();
            state.fileDirty = false;
            state.fileName = name || suggested;
            updateAutosaveUI("file");
            autosaveNow();
          };
          if (window.showSaveFilePicker) {
            let handle = opts.pickNew ? null : projectFileHandle || (await loadPersistedHandle());
            for (let attempt = 0; attempt < 2; attempt++) {
              try {
                if (!handle) {
                  handle = await window.showSaveFilePicker({
                    suggestedName: suggested,
                    types: [{ description: "Progetto OverPowerPoint", accept: { "application/json": [".json", ".opp"] } }],
                  });
                }
                const stream = await writableForHandle(handle);
                if (!stream) {
                  handle = null;
                  continue;
                }
                await stream.write(blob);
                await stream.close();
                projectFileHandle = handle;
                await persistFileHandle(handle);
                done(handle.name);
                logActivity("Progetto salvato su file", "save");
                toast("Progetto salvato nel file", "success");
                return true;
              } catch (e) {
                if (e && e.name === "AbortError") {
                  toast("Salvataggio annullato", "info", 1600);
                  return false;
                }
                console.warn("Scrittura sul file non riuscita", e);
                projectFileHandle = null;
                await idbDelete(FS_HANDLE_KEY);
                handle = null;
              }
            }
            toast("Salvataggio diretto non disponibile: scarico il file", "warn", 3200);
          }
          downloadBlob(blob, suggested);
          done(suggested);
          logActivity("Progetto scaricato", "save");
          toast("Progetto scaricato", "success");
          return true;

          const draw = () => {
            const t = $("patType").value,
              s = Number($("patScale").value),
              bg = $("patBg").value,
              fg = $("patFg").value;
            const c = document.createElement("canvas");
            c.width = 960;
            c.height = 540;
            const ctx = c.getContext("2d");
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, 960, 540);
            ctx.strokeStyle = fg;
            ctx.fillStyle = fg;
            for (let y = 0; y < 540 + s; y += s)
              for (let x = 0; x < 960 + s; x += s) {
                if (t === "dots") {
                  ctx.beginPath();
                  ctx.arc(x, y, s * 0.22, 0, Math.PI * 2);
                  ctx.fill();
                } else if (t === "stripes") {
                  ctx.save();
                  ctx.translate(x, y);
                  ctx.rotate(-0.6);
                  ctx.fillRect(-s, -s * 0.06, s * 2, s * 0.12);
                  ctx.restore();
                } else if (t === "grid") {
                  ctx.lineWidth = 1.5;
                  ctx.strokeRect(x, y, s, s);

                  ctx.moveTo(x, y);
                  ctx.quadraticCurveTo(x + s / 2, y - s * 0.5, x + s, y);

        async function recordDeckWebm(opts = {}) {
          if (typeof MediaRecorder === "undefined" || !HTMLCanvasElement.prototype.captureStream) {

            return;
          }
          const width = clamp(Number(opts.width) || 1280, 640, 1920),

          canvas.height = height;

          const stream = canvas.captureStream(30);
          let audioCtx = null,
            audioDest = null;
          if (opts.audio && slides.some((s) => s.audio?.src)) {
            try {
              audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              await audioCtx.resume();
              audioDest = audioCtx.createMediaStreamDestination();
              audioDest.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
            } catch (e) {
              console.warn("Audio registrazione non disponibile", e);
            }
          }
          const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find((m) => MediaRecorder.isTypeSupported(m)) || "";

            recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: width > 1400 ? 6000000 : 3500000 } : undefined);
          } catch (e) {
            toast("MediaRecorder non disponibile", "error");
            return;

            currentSource = null;

          status.innerHTML = `<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px"><span style="width:8px;height:8px;border-radius:50%;background:#ff6472;box-shadow:0 0 8px #ff6472"></span><b>Registrazione WebM</b><span style="flex:1"></span><button id="webStop" style="color:#ff9aa4;font-size:10px">Ferma</button></div><div class="progress" style="height:5px;background:rgba(255,255,255,.09);border-radius:3px;overflow:hidden"><div id="webBar" style="height:100%;width:0;background:linear-gradient(90deg,#ff9a2e,#ffd08a);transition:width .2s"></div></div><div id="webInfo" style="font-size:9px;color:#8e9bb0;margin-top:6px">Preparazione…</div>`;
          document.body.appendChild(status);
          $("webStop").onclick = () => {
            cancelled = true;
            $("webInfo").textContent = "Interruzione…";
          };
          recorder.start(250);
          const total = slides.length;
          for (let i = 0; i < total && !cancelled; i++) {
            const s = slides[i];
            const c = await slideToCanvas(s, width / state.W);
            ctx.drawImage(c, 0, 0, width, height);
            if (audioCtx && audioDest && s.audio?.src) {
              try {
                if (currentSource) {
                  try {
                    currentSource.stop();
                  } catch (e) {}
                }
                const buf = await (await fetch(s.audio.src)).arrayBuffer();
                const audioBuf = await audioCtx.decodeAudioData(buf.slice(0));
                currentSource = audioCtx.createBufferSource();
                currentSource.buffer = audioBuf;
                const gain = audioCtx.createGain();
                gain.gain.value = clamp(s.audio.volume ?? 1, 0, 1);
                currentSource.connect(gain);

              const m = raw.match(re);

            });
            const rep = raw.match(/\b([A-Za-zÀ-ÿ]+)\s+\1\b/gi);

            if (/ {2,}/.test(raw)) out.push({ slide: x.slide, el: x.el, text: raw, msg: "Spazi multipli", auto: true });

              ta.value = text;
              ta.style.position = "fixed";

        function pathTargetPath() {
          const el = firstSelected();
          if (el?.type !== "path") {

            return null;
          }
          return el;
        }
        function simplifyNodes(nodes, tol = 0.012) {
          if ((nodes || []).length <= 3) return (nodes || []).slice();
          const pts = nodes.map((n) => ({ x: Number(n.x), y: Number(n.y) }));
          let changed = true;
          while (pts.length > 3 && changed) {
            changed = false;
            for (let i = 1; i < pts.length - 1; i++) {
              const a = pts[i - 1],
                b = pts[i],
                c = pts[i + 1];
              const base = Math.hypot(c.x - a.x, c.y - a.y) || 1;
              const area = Math.abs((c.x - a.x) * (b.y - a.y) - (c.y - a.y) * (b.x - a.x));
              if (area / base < tol) {
                pts.splice(i, 1);
                changed = true;
                break;
              }
            }
          }
          return pts;
        }
        function simplifySelectedPath() {
          const el = pathTargetPath();
          if (!el) return;
          if ((el.nodes || []).length <= 3) {
            toast("Il tracciato ha già pochi nodi", "info");
            return;
          }
          const before = el.nodes.length;
          el.nodes = simplifyNodes(el.nodes, 0.015);
          state.selectedNode = null;
          commit("Semplifica tracciato");
          renderAll();
          toast(`${before - el.nodes.length} nodi rimossi`, "success");
        }
        function addNodeToSelectedPath() {
          const el = pathTargetPath();
          if (!el) return;
          const nodes = el.nodes || [];
          if (nodes.length < 2) {
            toast("Servono almeno due nodi", "warn");
            return;
          }
          let idx = state.selectedNode;
          if (idx == null) idx = nodes.length - 2;
          const a = nodes[idx],
            b = nodes[idx + 1] || nodes[0];
          nodes.splice(idx + 1, 0, { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
          state.selectedNode = idx + 1;
          commit("Aggiungi nodo");
          renderAll();
        }
        function closePath() {
          const el = pathTargetPath();
          if (!el) return;
          if ((el.nodes || []).length < 3) {

          el.closed = true;
          commit("Chiudi tracciato");

        function togglePanel(side) {
          const panel = $(side === "left" ? "leftPanel" : "rightPanel");
          const other = $(side === "left" ? "rightPanel" : "leftPanel");
          const willOpen = panel.classList.contains("collapsed");
          panel.classList.toggle("collapsed");
          if (isNarrowLayout() && willOpen && other) other.classList.add("collapsed");
          updatePanelBackdrop();
          renderStatus();
          setTimeout(() => {
            fitZoom();
            updatePanelBackdrop();

        function bindDropFiles() {
          document.addEventListener("dragover", (ev) => {
            if (Array.from(ev.dataTransfer?.types || []).includes("Files")) {
              ev.preventDefault();
              ev.dataTransfer.dropEffect = "copy";
            }
          });
          document.addEventListener("drop", async (ev) => {
            const files = Array.from(ev.dataTransfer?.files || []);
            if (!files.length) return;
            ev.preventDefault();
            ev.stopPropagation();
            const imgs = files.filter((f) => f.type.startsWith("image/"));
            if (imgs.length) {
              const els = [];
              const baseW = Math.min(state.W * 0.6, 420),
                baseH = (baseW * 9) / 16;
              let placed = 0;
              for (const f of imgs.slice(0, 12)) {
                try {
                  const info = await fileToImage(f);
                  const scale = Math.min(1, baseW / info.w, baseH / info.h, (state.H * 0.55) / info.h);
                  const w = Math.max(40, info.w * scale),
                    h = Math.max(40, info.h * scale);
                  const off = placed * 18;
                  els.push(imageElement(info.src, w, h, { x: (state.W - w) / 2 + off, y: (state.H - h) / 2 + off, name: info.name, alt: info.name }));
                  placed++;
                } catch (e) {
                  console.warn(e);
                }
              }
              if (els.length) {
                currentSlide().elements.push(...els);
                state.selected = els.map((e) => e.id);
                commit("Immagini trascinate");
                renderAll();
                toast(`${els.length} immagini inserite`, "success");
              }
              return;
            }
            const file = files[0];
            try {
              if (/\.(json|opp)$/i.test(file.name)) {
                const data = JSON.parse(await readFileAsText(file));
                loadProjectData(data, { historyLabel: "Apri progetto trascinato", silent: false });
                fitZoom();
                return;
              }
              if (/\.html?$/i.test(file.name)) {
                const doc = new DOMParser().parseFromString(await readFileAsText(file), "text/html");
                const holder = doc.getElementById("opp-export-data");
                if (!holder) throw new Error("Dati OverPowerPoint assenti");
                loadProjectData(JSON.parse(b64Decode(holder.textContent.trim())), { historyLabel: "Importa HTML trascinato", silent: false });
                fitZoom();
                return;
              }
              if (/\.(mp3|wav|ogg|m4a|aac)$/i.test(file.name) || file.type.startsWith("audio/")) {
                const src = await readFileAsDataURL(file);
                insertElement(
                  mediaElement("audio", src, file.name, {
                    name: "Audio",
                    mediaName: file.name,
                    x: state.W / 2 - 180,
                    y: state.H / 2 - 70,
                    w: 360,
                    h: 140,
                    volume: 1,
                  }),
                  "Inserisci audio",
                );
                return;
              }
              if (/\.(mp4|webm|mov|m4v)$/i.test(file.name) || file.type.startsWith("video/")) {
                const src = await readFileAsDataURL(file);
                insertElement(
                  mediaElement("video", src, file.name, {
                    name: "Video",
                    mediaName: file.name,
                    x: state.W / 2 - 240,
                    y: state.H / 2 - 135,
                    w: 480,
                    h: 270,
                    volume: 1,
                  }),
                  "Inserisci video",
                );
                return;
              }
              if (/\.pptx$/i.test(file.name)) {
                toast("Per importare PPTX usa File → Importa PPTX", "info", 2800);
                return;
              }
              toast("Tipo di file non supportato", "warn");
            } catch (e) {
              console.error(e);
              toast("File non leggibile: " + e.message, "error");
            }
          });
        }
        async function showDensityNotice() {
          if ($("densityNotice")) return;
          const box = document.createElement("div");
          box.id = "densityNotice";
          box.className = "density-notice";
          box.innerHTML = `<div>Abbiamo ridotto la densità dell’interfaccia. Tutti i comandi restano disponibili da «Altro → Tutti i comandi» o da «Interfaccia completa». La scelta si cambia in Preferenze.</div><div class="dn-actions"><button id="densityNoticeOk">Ho capito</button></div>`;
          document.body.appendChild(box);
          const close = () => {
            if (document.body.contains(box)) box.remove();
            if (!state.settings.densityNoticeSeen) {
              state.settings.densityNoticeSeen = true;
              saveSettings();
            }
          };
          $("densityNoticeOk").onclick = close;
          setTimeout(close, 9000);
        }
        async function init() {
          loadSettings();
          loadLibrary();
          loadActivity();
          loadVersions();
          state.settings = Object.assign({}, DEFAULT_SETTINGS, state.settings);
          state.docName = state.docName || "Presentazione senza titolo";
          applyUiTheme(state.settings.uiTheme);
          bindUI();
          bindDropFiles();
          bindModalEvents();
          installCanvasInteractions();
          installCommandDelegation();
          installKeyboard();
          installEffectsDelegation();
          await loadEffectsCatalog();
          renderTabsActive();
          renderRibbon();
          renderColorPanel();
          registerAllFonts();
          let restored = false;
          try {
            restored = await tryLoadAutosave();
          } catch (e) {
            console.warn(e);
          }
          projectFileHandle = restored ? await loadPersistedHandle() : null;
          if (!restored) await forgetFileHandle();
          if (!restored) buildWelcomeDeck();
          renderStatus();
          fitZoom();
          updateAutosaveUI("saved");
          if (isNarrowLayout()) {
            closePanelsForNarrow();
            setTimeout(fitZoom, 60);
          }
          updatePanelBackdrop();
          if (state.settings.showTips) setTimeout(() => toast("Suggerimento: Ctrl+K apre tutti i comandi", "info", 4200), 900);
          if (!state.settings.densityNoticeSeen) setTimeout(showDensityNotice, 2600);
          if (isNarrowLayout() && !state.settings.touchTipSeen) {
            setTimeout(() => {
              toast("Tieni premuto su un’icona per il nome; tutti i comandi sono in «Altro»", "info", 5200);
              state.settings.touchTipSeen = true;
              saveSettings();
            }, 4200);
          }
          Object.assign(window.OPP, {
            runCommand,
            COMMANDS,
            renderAll,
            loadProjectData,
            currentSlide,
            serializeDoc,
            exportReviewReport,
            openCommandPalette,
            saveVersion,
            startPresentation,
            endPresentation,
          });
          console.info("OverPowerPoint Studio 2.0 pronto");
        }
        init();
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", () => {
            navigator.serviceWorker
              .register("sw.js")
              .catch((err) => console.warn("SW non registrato", err));
          });
        }
      })();
    </script>
  </body>
</html>
