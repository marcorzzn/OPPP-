<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splitta immagine in pannelli</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --border: #2a2e38;
        --accent: #4f8cff;
        --text: #e8eaed;
        --muted: #9aa0ab;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px 16px 60px;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 600;
        text-align: center;
        margin: 0 0 6px;
      }
      p.subtitle {
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 0 24px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      .dropzone {
        border: 2px dashed var(--border);
        border-radius: 14px;
        padding: 40px 20px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s;
        background: var(--panel);
      }
      .dropzone.dragover {
        border-color: var(--accent);
        background: #1c2230;
      }
      .dropzone p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .dropzone strong {
        color: var(--text);
      }
      input[type="file"] {
        display: none;
      }
      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        margin: 20px 0;
      }
      select,
      button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #preview-wrap {
        margin-top: 24px;
        display: none;
      }
      #preview-strip {
        display: flex;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        background: var(--panel);
      }
      #preview-strip canvas {
        display: block;
        width: 25%;
        height: auto;
        border-right: 1px dashed rgba(255, 255, 255, 0.15);
      }
      #preview-strip canvas:last-child {
        border-right: none;
      }
      .panels-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 16px;
      }
      .panel-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        text-align: center;
      }
      .panel-card canvas {
        width: 100%;
        height: auto;
        border-radius: 6px;
        display: block;
        margin-bottom: 8px;
      }
      .panel-card span {
        display: block;
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .panel-card a,
      .panel-card button.send {
        display: block;
        width: 100%;
        background: var(--accent);
        color: white;
        text-decoration: none;
        font-size: 0.8rem;
        padding: 6px 0;
        border: 0;
        border-radius: 6px;
        margin-top: 6px;
        cursor: pointer;
      }
      @media (max-width: 640px) {
        .panels-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      /* Modalità dentro OPP: via titolo e descrizione, restano controlli e canvas */
      body.embed h1,
      body.embed p.subtitle {
        display: none !important;
      }
      body.embed {
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Splitta immagine in pannelli verticali</h1>
      <p class="subtitle">Carica una foto e ottieni N strisce verticali identiche, pronte per un carosello.</p>

      <div class="dropzone" id="dropzone">
        <div>📷</div>
        <p><strong>Clicca per scegliere un'immagine</strong><br />oppure trascinala qui</p>
        <input type="file" id="fileInput" accept="image/*" />
      </div>

      <div class="controls">
        <label style="color: var(--muted); font-size: 0.9rem">
          Numero pannelli:
          <select id="panelCount">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>
        </label>
        <button id="downloadAllBtn" class="primary" disabled>Scarica tutti i pannelli</button>
      </div>

      <div id="preview-wrap">
        <p style="color: var(--muted); font-size: 0.85rem; text-align: center; margin-bottom: 8px">
          Anteprima combinata (così controlli che l'immagine "scorra" bene)
        </p>
        <div id="preview-strip"></div>
        <div class="panels-grid" id="panelsGrid"></div>
      </div>
    </div>

    <script src="./sdk.js"></script>
    <script>
      const dropzone = document.getElementById("dropzone");
      const fileInput = document.getElementById("fileInput");
      const previewWrap = document.getElementById("preview-wrap");
      const previewStrip = document.getElementById("preview-strip");
      const panelsGrid = document.getElementById("panelsGrid");
      const panelCountSelect = document.getElementById("panelCount");
      const downloadAllBtn = document.getElementById("downloadAllBtn");

      let currentImage = null;
      let firstPanelCanvas = null;
      window.getEffectCanvas = () => firstPanelCanvas; // contratto effetti

      dropzone.addEventListener("click", () => fileInput.click());
      dropzone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropzone.classList.add("dragover");
      });
      dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
      dropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.classList.remove("dragover");
        if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
      });
      fileInput.addEventListener("change", () => {
        if (fileInput.files && fileInput.files[0]) handleFile(fileInput.files[0]);
      });
      panelCountSelect.addEventListener("change", () => {
        if (currentImage) renderPanels();
      });

      function handleFile(file) {
        if (!file.type.startsWith("image/")) {
          alert("Per favore carica un file immagine (jpg, png, ecc).");
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            currentImage = img;
            renderPanels();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function renderPanels() {
        const n = parseInt(panelCountSelect.value, 10);
        const w = currentImage.width;
        const h = currentImage.height;
        const sliceWidth = w / n;

        previewStrip.innerHTML = "";
        panelsGrid.innerHTML = "";
        const panelCanvases = [];

        for (let i = 0; i < n; i++) {
          const previewCanvas = document.createElement("canvas");
          previewCanvas.width = sliceWidth;
          previewCanvas.height = h;
          drawSlice(previewCanvas, i, sliceWidth, h);
          previewStrip.appendChild(previewCanvas);

          const fullCanvas = document.createElement("canvas");
          fullCanvas.width = Math.round(sliceWidth);
          fullCanvas.height = h;
          drawSlice(fullCanvas, i, sliceWidth, h);
          panelCanvases.push(fullCanvas);
          if (i === 0) firstPanelCanvas = fullCanvas;

          const card = document.createElement("div");
          card.className = "panel-card";

          const cardCanvas = document.createElement("canvas");
          cardCanvas.width = sliceWidth;
          cardCanvas.height = h;
          drawSlice(cardCanvas, i, sliceWidth, h);

          const label = document.createElement("span");
          label.textContent = "Pannello " + (i + 1);

          const link = document.createElement("a");
          link.textContent = "Scarica";
          link.href = fullCanvas.toDataURL("image/png");
          link.download = "pannello-" + (i + 1) + ".png";

          card.appendChild(cardCanvas);
          card.appendChild(label);
          card.appendChild(link);
          if (window.OPPFrame && OPPFrame.isEmbed()) {
            const send = document.createElement("button");
            send.className = "send";
            send.textContent = "Invia a OPP";
            send.onclick = () => OPPFrame.sendImage(fullCanvas, "pannello-" + (i + 1) + ".png");
            card.appendChild(send);
          }
          panelsGrid.appendChild(card);
        }

        previewWrap.style.display = "block";
        downloadAllBtn.disabled = false;

        downloadAllBtn.onclick = () => {
          panelCanvases.forEach((canvas, i) => {
            const a = document.createElement("a");
            a.href = canvas.toDataURL("image/png");
            a.download = "pannello-" + (i + 1) + ".png";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          });
        };
      }

      function drawSlice(canvas, index, sliceWidth, h) {
        const ctx = canvas.getContext("2d");
        const sx = index * sliceWidth;
        ctx.drawImage(currentImage, sx, 0, sliceWidth, h, 0, 0, canvas.width, h);
      }
    </script>
  </body>
</html>
