<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="../icons/favicon-32.png" />
    <title>Poster Vintage — OverPowerPoint Studio</title>
    <style>
      :root {
        --bg: #121316;
        --fg: #f3f4f6;
        --muted: #9ca3af;
        --card: #181a1f;
        --line: #2a2e37;
        --acc: #ff5500;
        --acc-hover: #e04800;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      :root[data-theme="light"],
      body[data-theme="light"] {
        --bg: #f4f5f7;
        --fg: #111317;
        --muted: #5b6370;
        --card: #ffffff;
        --line: #d5d9e2;
        --acc: #ff5500;
        --acc-hover: #e04800;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.45;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      h1 {
        font-size: 1.45rem;
        font-weight: 800;
        margin: 0.2em 0 0.1em;
        letter-spacing: -0.01em;
      }
      p.sub {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 14px;
        margin-bottom: 18px;
      }
      input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px dashed var(--line);
        border-radius: 4px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        font-size: 0.88rem;
      }
      .row label {
        flex: 0 0 150px;
        font-weight: 600;
      }
      .row input[type="range"] {
        flex: 1;
        accent-color: var(--acc);
      }
      .row output {
        width: 34px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .card {
        margin-bottom: 26px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px;
      }
      .card .tag {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 8px;
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 4px;
        border: 1px solid var(--line);
      }
      button {
        margin-top: 10px;
        margin-right: 8px;
        padding: 8px 14px;
        border: 1px solid var(--acc);
        border-radius: 4px;
        background: var(--acc);
        color: #fff;
        font: 600 0.85rem inherit;
        cursor: pointer;
      }
      button:hover {
        background: var(--acc-hover);
      }
      .sw {
        display: flex;
        gap: 4px;
        margin-top: 8px;
      }
      .sw i {
        width: 22px;
        height: 22px;
        border-radius: 3px;
        border: 1px solid var(--line);
      }
      #msg {
        color: var(--muted);
        font-size: 0.85rem;
      }
      /* Modalità dentro OPP: via titolo e descrizione, restano controlli e canvas */
      body.embed h1,
      body.embed p.sub {
        display: none !important;
      }
      body.embed main {
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Poster Vintage</h1>
      <p class="sub">Carica una o più foto (le vedrai in sequenza): diventano serigrafie anni ’70 a colori limitati.</p>
      <div class="panel">
        <input type="file" id="file" accept="image/*" multiple />
        <div class="row"><label for="k">Numero di colori</label><input type="range" id="k" min="3" max="8" value="5" /><output>5</output></div>
        <div class="row"><label for="s">Semplificazione</label><input type="range" id="s" min="0" max="10" value="3" /><output>3</output></div>
        <div class="row"><label for="t">Sfumature tonali</label><input type="range" id="t" min="0" max="40" value="15" /><output>15</output></div>
        <div class="row"><label for="g">Grana</label><input type="range" id="g" min="0" max="40" value="14" /><output>14</output></div>
        <div class="row"><label for="v">Carta invecchiata</label><input type="range" id="v" min="0" max="100" value="40" /><output>40</output></div>
        <div class="row"><label for="m">Margine bianco</label><input type="checkbox" id="m" checked /></div>
      </div>
      <div id="msg"></div>
      <div id="out"></div>
    </main>
    <script src="./sdk.js"></script>
    <script>
      const $ = (s) => document.querySelector(s);
      let imgs = [];
      let lastCanvas = null;
      window.getEffectCanvas = () => lastCanvas; // contratto effetti

      document.querySelectorAll("input[type=range]").forEach((r) => {
        r.addEventListener("input", () => (r.nextElementSibling.textContent = r.value));
        r.addEventListener("change", render);
      });
      $("#m").addEventListener("change", render);

      $("#file").addEventListener("change", async (e) => {
        const files = [...e.target.files];
        imgs = await Promise.all(
          files.map(
            (f) =>
              new Promise((res) => {
                const im = new Image();
                im.onload = () => res(im);
                im.src = URL.createObjectURL(f);
              }),
          ),
        );
        render();
      });

      function blur(d, w, h, r) {
        if (!r) return d.slice();
        let a = d.slice(),
          b = d.slice();
        for (let p = 0; p < 2; p++) {
          const len = p ? h : w,
            lines = p ? w : h,
            step = p ? w * 4 : 4,
            lstep = p ? 4 : w * 4;
          for (let l = 0; l < lines; l++) {
            const base = l * lstep;
            for (let ch = 0; ch < 3; ch++) {
              let s = 0;
              for (let i = -r; i <= r; i++) s += a[base + Math.min(len - 1, Math.max(0, i)) * step + ch];
              for (let i = 0; i < len; i++) {
                b[base + i * step + ch] = s / (2 * r + 1);
                s += a[base + Math.min(len - 1, i + r + 1) * step + ch] - a[base + Math.max(0, i - r) * step + ch];
              }
            }
          }
          [a, b] = [b, a];
        }
        return a;
      }

      const dist = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;

      function kmeans(d, k) {
        const N = d.length / 4,
          S = [],
          step = Math.max(1, Math.floor(N / 8000));
        for (let i = 0; i < N; i += step) S.push([d[i * 4], d[i * 4 + 1], d[i * 4 + 2]]);
        const C = [S[Math.floor(S.length / 2)].slice()];
        while (C.length < k) {
          let best = null,
            bd = -1;
          for (const s of S) {
            let m = 1e9;
            for (const c of C) m = Math.min(m, dist(s, c));
            if (m > bd) {
              bd = m;
              best = s;
            }
          }
          C.push(best.slice());
        }
        for (let it = 0; it < 10; it++) {
          const sum = C.map(() => [0, 0, 0, 0]);
          for (const s of S) {
            let bi = 0,
              bd = 1e9;
            C.forEach((c, i) => {
              const q = dist(s, c);
              if (q < bd) {
                bd = q;
                bi = i;
              }
            });
            sum[bi][0] += s[0];
            sum[bi][1] += s[1];
            sum[bi][2] += s[2];
            sum[bi][3]++;
          }
          sum.forEach((q, i) => {
            if (q[3]) C[i] = [q[0] / q[3], q[1] / q[3], q[2] / q[3]];
          });
        }
        return C;
      }

      function poster(img, c) {
        const k = +$("#k").value,
          sm = +$("#s").value,
          tone = +$("#t").value / 100;
        const grain = +$("#g").value,
          old = +$("#v").value / 100,
          border = $("#m").checked;
        const sc = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
        const W = Math.round(img.naturalWidth * sc),
          H = Math.round(img.naturalHeight * sc);
        const m = border ? Math.round(Math.min(W, H) * 0.05) : 0;

        const t = document.createElement("canvas");
        t.width = W;
        t.height = H;
        const tx = t.getContext("2d");
        tx.drawImage(img, 0, 0, W, H);
        const id = tx.getImageData(0, 0, W, H),
          d = id.data;
        const bl = blur(d, W, H, sm);

        const pal = kmeans(bl, k).map((col) => {
          const lum = 0.3 * col[0] + 0.59 * col[1] + 0.11 * col[2];
          return col.map((v) => {
            v = v + (lum - v) * 0.12 * (0.5 + old);
            return v * 0.93 + 13;
          });
        });
        for (let i = 0; i < d.length; i += 4) {
          const p = [bl[i], bl[i + 1], bl[i + 2]];
          let bi = 0,
            bd = 1e9;
          for (let j = 0; j < pal.length; j++) {
            const q = dist(p, pal[j]);
            if (q < bd) {
              bd = q;
              bi = j;
            }
          }
          for (let ch = 0; ch < 3; ch++) d[i + ch] = pal[bi][ch] * (1 - tone) + bl[i + ch] * tone;
          d[i + 3] = 255;
        }
        tx.putImageData(id, 0, 0);

        c.width = W + 2 * m;
        c.height = H + 2 * m;
        const x = c.getContext("2d");
        const P = [246 - 14 * old, 238 - 22 * old, 218 - 40 * old];
        x.fillStyle = `rgb(${P})`;
        x.fillRect(0, 0, c.width, c.height);
        x.drawImage(t, m, m);

        const f = x.getImageData(0, 0, c.width, c.height),
          q = f.data;
        for (let i = 0; i < q.length; i += 4) {
          const n = (Math.random() + Math.random() - 1) * grain * 1.6;
          q[i] = q[i] * (P[0] / 255) * 0.5 + q[i] * 0.5 + n;
          q[i + 1] = q[i + 1] * (P[1] / 255) * 0.5 + q[i + 1] * 0.5 + n;
          q[i + 2] = q[i + 2] * (P[2] / 255) * 0.5 + q[i + 2] * 0.5 + n;
        }
        x.putImageData(f, 0, 0);
        const nf = Math.round((c.width * c.height) / 3500);
        for (let i = 0; i < nf; i++) {
          const px = Math.random() * c.width,
            py = Math.random() * c.height,
            a = Math.random() * 6.28,
            l = 4 + Math.random() * 12;
          x.strokeStyle = Math.random() < 0.5 ? `rgba(110,90,60,${0.04 + old * 0.05})` : "rgba(255,255,255,0.07)";
          x.lineWidth = 0.6;
          x.beginPath();
          x.moveTo(px, py);
          x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l);
          x.stroke();
        }
        return pal;
      }

      async function render() {
        const out = $("#out");
        out.innerHTML = "";
        $("#msg").textContent = imgs.length ? "Elaborazione…" : "";
        let n = 1;
        for (const im of imgs) {
          await new Promise((r) => setTimeout(r, 20));
          const card = document.createElement("div");
          card.className = "card";
          const c = document.createElement("canvas");
          const pal = poster(im, c);
          lastCanvas = c;
          card.innerHTML = `<div class="tag">Immagine ${n} di ${imgs.length}</div>`;
          card.appendChild(c);
          const sw = document.createElement("div");
          sw.className = "sw";
          pal
            .slice()
            .sort((a, b) => a[0] + a[1] + a[2] - b[0] - b[1] - b[2])
            .forEach((p) => {
              const i = document.createElement("i");
              i.style.background = `rgb(${p.map(Math.round)})`;
              sw.appendChild(i);
            });
          card.appendChild(sw);
          const b = document.createElement("button");
          b.textContent = "Scarica PNG";
          const num = n;
          b.onclick = () => {
            const a = document.createElement("a");
            a.download = `poster-${num}.png`;
            a.href = c.toDataURL("image/png");
            a.click();
          };
          card.appendChild(b);
          if (window.OPPFrame && OPPFrame.isEmbed()) {
            const send = document.createElement("button");
            send.textContent = "Invia a OPP";
            send.onclick = () => OPPFrame.sendImage(c, `poster-${num}.png`);
            card.appendChild(send);
          }
          out.appendChild(card);
          n++;
        }
        $("#msg").textContent = "";
      }
    </script>
  </body>
</html>
